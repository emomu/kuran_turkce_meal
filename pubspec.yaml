name: kuran_turkce_meal
description: "Kur'an-ı Kerim Türkçe meali — iniş sırasına göre okuma, tam metin arama, kök analizi, peygamber kıssaları, tilavet ve okuma planları. Metin çevrimdışı."
publish_to: 'none' 


version: 1.0.2+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  sqflite: ^2.4.2+1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  path: ^1.9.1
  scrollable_positioned_list: ^0.3.8
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.8
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  package_info_plus: ^10.2.1
  sqflite_common_ffi: ^2.4.0+3
  sqlite3_flutter_libs: ^0.5.41
  lottie: ^3.3.3
  home_widget: ^0.9.3

  # Bağış bağlantısını cihazın tarayıcısında açmak için. Ödeme uygulamanın
  # dışında tamamlanır: uygulama içi bir ödeme akışı yok, WebView yok.
  url_launcher: ^6.3.1

  # Tilavet sesi. `just_audio` ayet dosyalarını tek kesintisiz akış gibi
  # çalar; `just_audio_background` kilit ekranı ve bildirim kontrollerini
  # verir; `audio_session` telefon geldiğinde susmayı, kulaklık çıkınca
  # durmayı sistemle uyumlu yapar. `http` yalnızca ses indirmede kullanılır.
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.15
  audio_session: ^0.1.25
  http: ^1.2.2
  # İndirme onayında mobil veri uyarısı gösterebilmek için. Yalnızca
  # bağlantı türü sorulur; ağ erişimi ya da konum izni gerektirmez.
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Ayet kartının görsele çevrilmesi yalnızca gerçek bir raster hattında
  # doğrulanabiliyor; `flutter test` ortamında `toImage` hiç tamamlanmıyor.
  # Bu yüzden o yol integration_test ile cihazda/öykünücüde koşuluyor.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/translations/
    - assets/lottie/

  # Fontlar uygulamayla birlikte paketlenir. Çalışma anında indirilmezler;
  # uygulama hiçbir ağ isteği yapmaz ve ilk açılış çevrimdışı da doğru
  # görünür. Her iki aile de değişken (variable) font: tek dosya bütün
  # ağırlıkları taşır. Lisans: SIL Open Font License 1.1 (OFL-*.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          style: italic

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
